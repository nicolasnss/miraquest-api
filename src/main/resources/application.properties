spring.application.name=miraquest.api

spring.sql.init.encoding=UTF-8

# Banco padrão: PostgreSQL (sobrescreva por variáveis de ambiente). Perfil "h2": banco em memória para dev/testes.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/miraquest}
spring.datasource.username=${DB_USER:miraquest}
spring.datasource.password=${DB_PASSWORD:miraquest}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

springdoc.swagger-ui.path=/swagger-ui.html


# JWT: JWT_SECRET é obrigatório (>= 32 bytes, aleatório e só seu); sem ele a aplicação não inicia.
# O perfil "h2" gera um segredo descartável a cada execução.
miraquest.jwt.secret=${JWT_SECRET}
miraquest.jwt.expiracao-horas=${JWT_EXPIRACAO_HORAS:168}

# Contas administradoras (podem importar questões), separadas por vírgula. Vazio = ninguém.
miraquest.admin.emails=${ADMIN_EMAILS:}

# Limite de upload (importação CSV)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
