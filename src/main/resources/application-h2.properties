spring.datasource.url=jdbc:h2:mem:miraquest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo JWT descartável (novo a cada execução; tokens deixam de valer ao reiniciar). Nunca versionado.
miraquest.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
